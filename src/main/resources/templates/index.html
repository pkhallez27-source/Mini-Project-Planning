<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restay 캠핑장</title>

    <!-- 필수: 모든 HTML 페이지 <head> 안에 부트스트랩이 들어있어야 디자인이 안 깨집니다! -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- AOS 애니메이션 라이브러리 CSS 추가 -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body class="bg-light">

<!-- 메인페이지 헤더 딱 1줄만 호출! -->
<div th:replace="~{layout/header :: mainHeader}"></div>

<!-- 1. 메인 슬라이드 배너 (서서히 타타남) -->
<section class="position-relative overflow-hidden w-100" data-aos="fade">
    <img th:src="@{/images/mainbanner.png}" class="w-100 img-fluid object-fit-cover" style="max-height: 600px;" alt="메인 배너">
    <div class="position-absolute top-50 start-0 translate-middle-y ps-5 ms-md-5 text-dark">
    </div>
</section>

<!-- 2. Quick Menu 3종 (순차적으로 솟아오름) -->
<section class="container my-5">
    <div class="row g-4">
        <!-- 숙소안내 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="100">
            <div class="card h-100 border-0 shadow-sm p-3 rounded-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">숙소안내</h5>
                    <a th:href="@{/RoomList}" class="btn btn-sm btn-light border rounded-circle">+</a>
                </div>
                <a th:href="@{/RoomList}">
                    <img th:src="@{/images/roominfo.png}" class="img-fluid rounded-3 object-fit-cover h-100" alt="숙소안내">
                </a>
            </div>
        </div>

        <!-- 실시간예약하기 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="200">
            <div class="card h-100 border-0 shadow-sm p-3 rounded-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">실시간예약하기</h5>
                    <a th:href="@{/reservation}" class="btn btn-sm btn-light border rounded-circle">+</a>
                </div>
                <a th:href="@{/reservation}">
                    <img th:src="@{/images/reservationmain.png}" class="img-fluid rounded-3 object-fit-cover h-100" alt="실시간예약">
                </a>
            </div>
        </div>

        <!-- 부대시설 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="300">
            <div class="card h-100 border-0 shadow-sm p-3 rounded-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold m-0">부대시설</h5>
                    <a th:href="@{/Facilities}" class="btn btn-sm btn-light border rounded-circle">+</a>
                </div>
                <a th:href="@{/Facilities}">
                    <img th:src="@{/images/Facilities.png}" class="img-fluid rounded-3 object-fit-cover h-100" alt="부대시설">
                </a>
            </div>
        </div>
    </div>
</section>

<!-- 3. restay 캠핑장 소개 Section (좌/우 등장 효과) -->
<section class="py-5 bg-success bg-opacity-10 overflow-hidden">
    <div class="container">
        <div class="row align-items-center g-4">
            <div class="col-12 col-md-6" data-aos="fade-right">
                <img th:src="@{/images/Camping.png}" class="img-fluid rounded-end-5 shadow object-fit-cover w-100" style="height: 320px;" alt="캠핑장 소개">
            </div>
            <div class="col-12 col-md-6 ps-md-5" data-aos="fade-left">
                <h2 class="fw-bold mb-3">Restay 캠핑장</h2>
                <p class="text-secondary lh-lg mb-4">
                    푸른 바다와 숲이 함께하는 restay 캠핑장은<br>
                    자연을 품에 안고 일상에서 벗어나 여유와 휴식을 즐길 수 있는<br>
                    최적의 힐링 공간입니다.
                </p>
                <a th:href="@{/RoomIntro}" class="btn btn-success rounded-pill px-4 py-2">캠핑장 소개</a>
            </div>
        </div>
    </div>
</section>

<!-- 4. 부대시설 안내 Section (좌/우 대칭 등장 효과) -->
<section class="py-5 bg-white overflow-hidden">
    <div class="container">
        <div class="row align-items-center g-4">
            <div class="col-12 col-md-6 order-md-2" data-aos="fade-left">
                <img th:src="@{/images/facilities01.png}" class="img-fluid rounded-start-5 shadow object-fit-cover w-100" style="height: 320px;" alt="부대시설">
            </div>
            <div class="col-12 col-md-6 order-md-1 pe-md-5" data-aos="fade-right">
                <h2 class="fw-bold mb-3">부대시설 안내</h2>
                <p class="text-secondary lh-lg mb-4">
                    편리한 캠핑을 위해 관리사무실, 화장실, 샤워시설 등<br>
                    다양한 부대시설을 제공합니다.
                </p>
                <a th:href="@{/Facilities}" class="btn btn-success rounded-pill px-4 py-2">부대시설 안내</a>
            </div>
        </div>
    </div>
</section>

<!-- 5. 주변 관광지 Section (타이틀 후 카드 순차 상승) -->
<section class="container my-5 py-4">
    <h3 class="fw-bold text-center mb-4" data-aos="fade-up">주변 관광지</h3>
    <div class="row g-4">
        <!-- 관광지 1 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="100">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="row g-0 align-items-center">
                    <div class="col-5">
                        <img th:src="@{/images/Skywalk.png}" class="img-fluid object-fit-cover w-100" style="height: 120px;" alt="등기산 스카이워크">
                    </div>
                    <div class="col-7 p-3">
                        <h6 class="fw-bold mb-1">등기산 스카이워크</h6>
                        <p class="text-muted small mb-0 text-truncate">탁 트인 바다 전망과 스카이워크</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- 관광지 2 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="200">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="row g-0 align-items-center">
                    <div class="col-5">
                        <img th:src="@{/images/cablecar.png}" class="img-fluid object-fit-cover w-100" style="height: 120px;" alt="왕피천 케이블카">
                    </div>
                    <div class="col-7 p-3">
                        <h6 class="fw-bold mb-1">왕피천 케이블카</h6>
                        <p class="text-muted small mb-0 text-truncate">아름다운 해안선 감상</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- 관광지 3 -->
        <div class="col-12 col-md-4" data-aos="fade-up" data-aos-delay="300">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="row g-0 align-items-center">
                    <div class="col-5">
                        <img th:src="@{/images/Beach.png}" class="img-fluid object-fit-cover w-100" style="height: 120px;" alt="구산해수욕장">
                    </div>
                    <div class="col-7 p-3">
                        <h6 class="fw-bold mb-1">구산해수욕장</h6>
                        <p class="text-muted small mb-0 text-truncate">깨끗한 백사장과 맑은 바다</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 공통 푸터 불러오기 -->
<div th:replace="~{layout/footer :: footer}"></div>

<!-- AOS 애니메이션 스크립트 추가 및 초기화 -->
<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script>
    AOS.init({
        duration: 800,  // 애니메이션 재생 시간 (0.8초)
        once: true      // 스크롤 시 1회만 동작하도록 설정
    });
</script>

</body>
</html>
