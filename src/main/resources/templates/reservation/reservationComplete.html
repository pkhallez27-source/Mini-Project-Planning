<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>예약 완료</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <style>
      .reservation-sidebar {
          margin-top: 85px;
      }

  </style>

</head>
<body class="bg-light">


<header >
  <div th:replace="~{layout/header :: subHeader('subre.png')}"></div>
</header>

<div class="container my-5">
  <div class="row">

    <!-- 2. 오른쪽 본문 영역 (본인 작업 내용 넣기) -->
    <main class="col-12 mt-3">
      <h2 class="fw-bold mb-4 mx-2">예약 완료</h2>
      <div class="container mt-5">
        <div class="row justify-content-center">
          <div class="col-12">

            <div class="card shadow-sm">
              <div class="card-body p-5">

                <div class="text-center mb-4">
                  <div class="fs-1 mb-2">✓</div>
                  <h1 class="fw-bold">예약이 완료되었습니다.</h1>
                  <p class="text-secondary">예약 정보를 확인해주세요.</p>
                </div>

                <div class="table-responsive">
                  <table class="table table-bordered align-middle">
                    <tbody>
                    <tr>
                      <th class="table-light">예약 번호</th>
                      <td th:text="${reservation.rvCode}">RV0000</td>
                    </tr>
                    <tr>
                      <th class="table-light">객실</th>
                      <td th:text="${reservation.roomName}">ROOM</td>
                    </tr>
                    <tr>
                      <th class="table-light">예약 기간</th>
                      <td th:text="|${reservation.rvStartDate} ~ ${reservation.rvEndDate}|">DATE</td>
                    </tr>
                    <tr>
                      <th class="table-light">예약자</th>
                      <td th:text="${reservation.memberName}">NAME</td>
                    </tr>
                    <tr>
                      <th class="table-light">연락처</th>
                      <td th:text="${reservation.memberPhone}">PHONE</td>
                    </tr>
                    <tr>
                      <th class="table-light">투숙 인원</th>
                      <td th:text="|성인 ${reservation.rvPersonAdults}명 / 어린이 ${reservation.rvPersonKids}명|">
                        PERSON
                      </td>
                    </tr>
                    <tr>
                      <th class="table-light">결제 예정 금액</th>
                      <td class="fw-bold"
                          th:text="|${#numbers.formatInteger(reservation.rvPay, 0, 'COMMA')}원|">
                        0원
                      </td>
                    </tr>
                    </tbody>
                  </table>
                </div>

                <div class="text-center mt-4">
                  <a th:href="@{/}" class="btn btn-dark px-4">메인 화면으로 이동</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<footer>
  <div th:replace="~{layout/footer :: footer}"></div>
</footer>

</body>
</html>
