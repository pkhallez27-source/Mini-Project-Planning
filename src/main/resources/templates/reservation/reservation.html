<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>객실 예약</title>

  <!-- 부트스트랩 CSS & 아이콘 CDN (아이콘 누락 해결) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
      document.addEventListener('DOMContentLoaded', function () {
          const startDate = document.querySelector('#startDate');
          const endDate = document.querySelector('#endDate');

          startDate.addEventListener('change', function () {
              if (endDate.value <= startDate.value) {
                  const nextDate = new Date(startDate.value);
                  nextDate.setDate(nextDate.getDate() + 1);
                  endDate.value = nextDate.toISOString().slice(0, 10);
              }

              endDate.min = startDate.value;
          });
      });
  </script>

  <style>
      .room-img {
          width: 100%;
          height: 220px;
          object-fit: cover;
      }

      .reservation-sidebar {
          margin-top: 110px;
      }
  </style>
</head>
<body class="bg-light">

<!-- 공통 서브 헤더 적용 (중복 header 태그 제거) -->
<div th:replace="~{layout/header :: subHeader('subre.png')}"></div>

<div class="container">
  <div class="row">
    <!-- 본문 영역 -->
    <main class="col-12 mt-3">
      <h2 class="fw-bold mb-4 mx-2">예약 페이지</h2>
      <div class="container">
        <div class="mb-3">
          <p class="text-secondary mb-0">원하는 날짜를 선택하면 예약 가능한 객실만 조회됩니다.</p>
        </div>

        <div class="row g-4">

          <!-- 날짜 검색 -->
          <div class="col-lg-3">
            <div class="card shadow-sm">
              <div class="card-body">
                <form action="/reservation" method="get">
                  <div class="mb-3">
                    <label for="startDate" class="form-label fw-bold">FROM</label>
                    <input type="date" class="form-control" id="startDate" name="startDate"
                           th:value="${startDate}" th:min="${today}" required>
                  </div>

                  <div class="mb-3">
                    <label for="endDate" class="form-label fw-bold">TO</label>
                    <input type="date" class="form-control" id="endDate" name="endDate"
                           th:value="${endDate}" th:min="${today}" required>
                  </div>

                  <button type="submit" class="btn btn-dark w-100">객실 조회</button>
                </form>
              </div>
            </div>
          </div>

          <!-- 객실 목록 -->
          <div class="col-lg-9">

            <div th:if="${message}" class="alert alert-warning" th:text="${message}"></div>

            <div th:if="${roomList != null and !roomList.isEmpty()}">
              <div class="card shadow-sm mb-3" th:each="room : ${roomList}">
                <div class="row g-0">

                  <div class="col-md-4">
                    <img th:if="${room.resourcePath != null and !room.resourcePath.isBlank()}"
                         class="room-img rounded-start"
                         th:src="${room.resourcePath}"
                         alt="객실 이미지">

                    <div th:unless="${room.resourcePath != null and !room.resourcePath.isBlank()}"
                         class="room-img bg-secondary-subtle d-flex align-items-center justify-content-center text-secondary rounded-start">
                      객실 이미지 준비중
                    </div>
                  </div>

                  <div class="col-md-8">
                    <div class="card-body h-100 d-flex flex-column">
                      <h4 class="card-title fw-bold" th:text="${room.roomName}">ROOM NAME</h4>

                      <div class="text-secondary mb-3">
                        <div>객실 크기 : <span th:text="${room.roomSize}">-</span></div>
                        <div>기준 인원 : <span th:text="${room.roomBasicPerson}">0</span>명</div>
                        <div>최대 인원 : <span th:text="${room.roomMaxPerson}">0</span>명</div>
                        <div th:if="${room.roomService != null}" th:text="${room.roomService}"></div>
                      </div>

                      <p class="fw-bold mb-3">
                        주중
                        <span th:text="${#numbers.formatInteger(room.roomPriceWeekdays, 0, 'COMMA')}">0</span>원
                        /
                        주말
                        <span th:text="${#numbers.formatInteger(room.roomPriceWeekend, 0, 'COMMA')}">0</span>원
                      </p>

                      <p class="mb-3">
                        적용 금액 :
                        <strong th:text="|${#numbers.formatInteger(room.totalPrice, 0, 'COMMA')}원|">
                          0원
                        </strong>
                      </p>

                      <div class="mt-auto text-end">
                        <a class="btn btn-dark"
                           th:href="@{/reservation/detail(roomIdx=${room.roomIdx}, startDate=${startDate}, endDate=${endDate})}">
                          예약하기
                        </a>
                      </div>
                    </div>
                  </div>

                </div>
              </div>
            </div>

            <div class="alert alert-secondary text-center py-5"
                 th:if="${roomList == null or roomList.isEmpty()}">
              선택한 날짜에 예약 가능한 객실이 없습니다.
            </div>

          </div>
        </div>
      </div>
    </main>

  </div>
</div>

<footer>
  <div th:replace="~{layout/footer :: footer}"></div>
</footer>

</body>
</html>
