<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 1. 메인페이지 전용 헤더 -->
<header th:fragment="mainHeader" class="sticky-top bg-white shadow-sm" style="z-index: 1020;">
    <nav class="navbar navbar-expand-lg navbar-light py-2">
        <div class="container">
            <!-- 로고 -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-success" th:href="@{/}">
                <i class="bi bi-tree-fill fs-2"></i> Restay
            </a>

            <!-- 모바일용 햄버거 버튼 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 메뉴 영역 -->
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/RoomIntro}">캠핑장 소개</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/Facilities}">부대시설</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/RoomList}">숙소 안내</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/reservation}">실시간 예약</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/qna/list}">고객센터</a></li>
                </ul>

                <!-- [수정] 로그인 / 마이페이지 & 로그아웃 버튼 -->
                <div class="d-flex align-items-center gap-2">
                    <div th:if="${session.memberId == null}">
                        <a th:href="@{/member/login}" class="btn btn-outline-success rounded-pill px-4 fw-semibold">로그인</a>
                    </div>
                    <div th:if="${session.memberId != null}" class="d-flex gap-2">
                        <a th:href="@{/member/mypage}" class="btn btn-outline-success rounded-pill px-3 fw-semibold">마이페이지</a>
                        <a th:href="@{/member/logout}" class="btn btn-success rounded-pill px-3 text-white fw-semibold">로그아웃</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<!-- 2. 서브페이지 전용 헤더 -->
<th:block th:fragment="subHeader(bannerImg)">
    <!-- 네비게이션 바를 fixed-top으로 화면 최상단에 절대 고정 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm py-2 fixed-top" style="z-index: 1030;">
        <div class="container">
            <!-- 로고 -->
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-3 text-success" th:href="@{/}">
                <i class="bi bi-tree-fill fs-2"></i> Restay
            </a>

            <!-- 모바일용 햄버거 버튼 -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#subNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <!-- 메뉴 영역 -->
            <div class="collapse navbar-collapse" id="subNavbar">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/RoomIntro}">캠핑장 소개</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/Facilities}">부대시설</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/RoomList}">숙소 안내</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/reservation}">실시간 예약</a></li>
                    <li class="nav-item"><a class="nav-link fw-semibold" th:href="@{/qna/list}">고객센터</a></li>
                </ul>

                <!-- [수정] 로그인 / 마이페이지 & 로그아웃 버튼 -->
                <div class="d-flex align-items-center gap-2">
                    <div th:if="${session.memberId == null}">
                        <a th:href="@{/member/login}" class="btn btn-outline-success rounded-pill px-4 fw-semibold">로그인</a>
                    </div>
                    <div th:if="${session.memberId != null}" class="d-flex gap-2">
                        <a th:href="@{/member/mypage}" class="btn btn-outline-success rounded-pill px-3 fw-semibold">마이페이지</a>
                        <a th:href="@{/member/logout}" class="btn btn-success rounded-pill px-3 text-white fw-semibold">로그아웃</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- fixed-top 사용 시 서브 배너가 메뉴 뒤로 파고드는 현상을 방지하기 위한 여백(margin-top) 지정 -->
    <div class="sub-banner" style="margin-top: 65px;">
        <img th:src="@{|/images/${bannerImg}|}" alt="서브 배너" class="w-100 img-fluid object-fit-cover" style="max-height: 300px;">
    </div>
</th:block>

</body>
</html>
