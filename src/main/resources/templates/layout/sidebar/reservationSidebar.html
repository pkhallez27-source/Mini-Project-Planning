<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- 예약 파트 전용 사이드바 조각 -->
<div th:fragment="reservationSidebar" class="card border-0 shadow-sm rounded-4 p-3 mb-4">
  <!-- 사이드바 제목 -->
  <div class="px-2 py-2 mb-2 border-bottom">
    <h5 class="fw-bold text-success m-0">
      <i class="bi bi-calendar-check-fill me-2"></i>예약 안내
    </h5>
  </div>

  <!-- 예약 메뉴 목록 -->
  <div class="list-group list-group-flush">
    <!-- 1. 예약 페이지 -->
    <a th:href="@{/reservation}" class="list-group-item list-group-item-action border-0 rounded-3 py-2 px-3 fw-semibold text-secondary">
      <i class="bi bi-chevron-right me-2 small"></i>예약 페이지
    </a>

    <!-- 2. 예약 상세 -->
    <a th:href="@{/reservationDetail}" class="list-group-item list-group-item-action border-0 rounded-3 py-2 px-3 fw-semibold text-secondary">
      <i class="bi bi-chevron-right me-2 small"></i>예약 상세
    </a>

    <!-- 3. 예약 완료 -->
    <a th:href="@{/reservationComplete}" class="list-group-item list-group-item-action border-0 rounded-3 py-2 px-3 fw-semibold text-secondary">
      <i class="bi bi-chevron-right me-2 small"></i>예약 완료
    </a>
  </div>
</div>

</body>
</html>
